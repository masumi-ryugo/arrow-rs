[package]
name = "arrow-csv-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arrow-csv = { path = ".." }
arrow-schema = { path = "../../arrow-schema" }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "csv_reader"
path = "fuzz_targets/csv_reader.rs"
test = false
doc = false
bench = false
