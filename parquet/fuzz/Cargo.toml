[package]
name = "parquet-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
parquet = { path = "..", default-features = false, features = ["arrow", "snap", "brotli", "flate2-zlib-rs", "lz4", "zstd", "base64"] }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "arrow_reader"
path = "fuzz_targets/arrow_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "thrift_decode"
path = "fuzz_targets/thrift_decode.rs"
test = false
doc = false
bench = false
